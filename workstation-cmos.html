<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IT Repair &ndash; Workstation Won't Keep Settings, Now Won't POST (First Person Prototype)</title>
<link rel="stylesheet" href="assets/engine/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
  <div id="viewport"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="task-list"></div>
  <div id="worn-items"></div>
  <div id="move-hint">WASD to move<br>Mouse to look<br>Click / <kbd>E</kbd> to interact<br>Hold <kbd>E</kbd> to hold-and-press</div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-card"></div>
  </div>

  <div id="blocker">
    <div id="blocker-card">
      <h1>Workstation &mdash; Won't Keep Settings, Now Won't POST</h1>
      <p>This workstation has been reporting a wrong date/time and losing BIOS settings for weeks. Today it won't POST at all. Diagnose, repair, test, and return it.</p>
      <div class="start-btn">Click to start</div>
    </div>
  </div>

  <script type="module">
    import { buildFPScene } from "./assets/scene-workstation-cmos.js";

    const viewport = document.getElementById("viewport");
    const blocker = document.getElementById("blocker");

    const scenePromise = buildFPScene(viewport, {
      hintEl: document.getElementById("hint"),
      toastEl: document.getElementById("toast"),
      crosshairEl: document.getElementById("crosshair"),
      taskListEl: document.getElementById("task-list"),
      wornItemsEl: document.getElementById("worn-items"),
      modalOverlayEl: document.getElementById("modal-overlay"),
      modalCardEl: document.getElementById("modal-card"),
    });

    blocker.addEventListener("click", async () => {
      const api = await scenePromise;
      api.requestLock();
    });

    document.addEventListener("pointerlockchange", async () => {
      const api = await scenePromise;
      // Don't re-show the "click to start" blocker just because a modal
      // (diagnose, manual, signoff) intentionally released the pointer.
      if (!api.isModalOpen()) blocker.classList.toggle("hidden", api.isLocked());
    });
  </script>
</body>
</html>
